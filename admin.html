<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sapno Ka SMP | Admin Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111827;--line:#253247;--text:#edf3ff;--muted:#9aa9c0;--blue:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#172b4a 0,transparent 38%),var(--bg);font:14px/1.55 Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.wrap{max-width:1200px;margin:35px auto;padding:0 18px 50px}.top,.panel{background:linear-gradient(145deg,#131d2e,#0c121e);border:1px solid var(--line);border-radius:18px;padding:23px;margin-bottom:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.eyebrow{color:#91bfff;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}.top h1{margin:5px 0;font-size:27px}.muted{color:var(--muted)}input{background:#080f1b;border:1px solid #2b3a51;border-radius:10px;padding:12px;color:var(--text);font:inherit;width:100%;margin:5px 0 12px}button,select{border:1px solid #344967;border-radius:10px;padding:10px 13px;background:#172944;color:#eaf3ff;font:inherit;cursor:pointer}button.primary{background:linear-gradient(100deg,#438fff,#8272ff);border:0;font-weight:800}button.danger{background:#3b1c27;border-color:#703348}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat{background:#0c1523;border:1px solid var(--line);padding:15px;border-radius:13px}.stat strong{display:block;font-size:25px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:320px;margin:0}.list{display:grid;gap:10px}.app{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#0b1422;border:1px solid var(--line);padding:14px;border-radius:12px}.app h3{margin:0 0 3px}.app p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;background:#273247;color:#d8e6ff}.tag.Selected{background:#12432f;color:#a9f1d1}.tag.Rejected{background:#4a202b;color:#ffc0ca}.tag.Pending{background:#49391a;color:#ffe0a1}.hidden{display:none!important}.answer{border-top:1px solid var(--line);padding:12px 0}.answer b{display:block;color:#a9caff;margin-bottom:5px}.answer p{white-space:pre-wrap;margin:0;color:#dce6f6}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:#101a2a;border:1px solid #344967;border-radius:17px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:-22px;background:#101a2a;padding:5px 0 12px}.empty{text-align:center;padding:35px;color:var(--muted)}.msg{margin-top:10px;color:#ffc0ca;white-space:pre-wrap}
@media(max-width:650px){.stats{grid-template-columns:1fr}.app{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="eyebrow">Sapno Ka SMP • Management</div><h1>Recruitment Dashboard</h1><div class="muted">Review and manage staff applications.</div></div><button id="logoutBtn" class="hidden">Log out</button></header>
<section id="loginPanel" class="panel"><h2>Admin login</h2><p class="muted">Sign in with the admin account created in your Supabase project.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">Sign in</button><div id="loginMsg" class="msg"></div></form></section>
<section id="dashboard" class="hidden">
<div class="stats"><div class="stat"><span class="muted">Total applications</span><strong id="total">0</strong></div><div class="stat"><span class="muted">Pending</span><strong id="pending">0</strong></div><div class="stat"><span class="muted">Selected</span><strong id="selected">0</strong></div></div>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Search name, Minecraft or Discord..."><select id="filter"><option value="All">All statuses</option><option>Pending</option><option>Selected</option><option>Rejected</option></select><button id="refreshBtn">Refresh</button></div><div id="applications" class="list"><div class="empty">Loading applications...</div></div><div id="dashMsg" class="msg"></div></section>
</section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">Application details</div><h2 id="modalName" style="margin:4px 0"></h2></div><button id="closeModal">Close ✕</button></div><div id="details"></div><div class="row" style="margin-top:18px"><label for="statusSelect">Application status</label><select id="statusSelect"><option>Pending</option><option>Selected</option><option>Rejected</option></select><button id="saveStatus" class="primary">Save status</button><button id="deleteApp" class="danger">Delete application</button></div><div id="modalMsg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SETUP: Use the same Supabase Project URL and anon/public key as index.html. NEVER use a service_role key here. */
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const client = (SUPABASE_URL.startsWith("YOUR_")||SUPABASE_ANON_KEY.startsWith("YOUR_")) ? null : window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let applications=[], current=null;
const $=id=>document.getElementById(id);
function msg(id,text){$(id).textContent=text||""}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setSignedIn(on){$("loginPanel").classList.toggle("hidden",on);$("dashboard").classList.toggle("hidden",!on);$("logoutBtn").classList.toggle("hidden",!on)}
async function checkSession(){if(!client){msg("loginMsg","Add your Supabase URL and anon key in this file first.");return}const {data}=await client.auth.getSession();setSignedIn(!!data.session);if(data.session)loadApps()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!client)return msg("loginMsg","Configure Supabase URL and anon key first.");const {error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){msg("loginMsg",error.message);return}msg("loginMsg","");setSignedIn(true);loadApps()});
$("logoutBtn").onclick=async()=>{await client.auth.signOut();setSignedIn(false)};
async function loadApps(){msg("dashMsg","");$("applications").innerHTML='<div class="empty">Loading...</div>';const {data,error}=await client.from("staff_applications").select("*").order("created_at",{ascending:false});if(error){msg("dashMsg",error.message);$("applications").innerHTML='<div class="empty">Could not load applications.</div>';return}applications=data||[];render()}
function render(){const pending=applications.filter(a=>a.status==="Pending").length; $("total").textContent=applications.length;$("pending").textContent=pending;$("selected").textContent=applications.filter(a=>a.status==="Selected").length;const term=$("search").value.toLowerCase(),filter=$("filter").value;const rows=applications.filter(a=>(filter==="All"||a.status===filter)&&[a.real_name,a.mc_name,a.discord].some(x=>String(x||"").toLowerCase().includes(term)));$("applications").innerHTML=rows.length?rows.map(a=>`<article class="app"><div><h3>${esc(a.real_name)} <span class="tag ${esc(a.status)}">${esc(a.status)}</span></h3><p>${esc(a.mc_name)} • ${esc(a.discord)} • Age ${esc(a.age)} • ${new Date(a.created_at).toLocaleString()}</p></div><button data-open="${esc(a.id)}">View application →</button></article>`).join(""):'<div class="empty">No applications found.</div>';document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openApp(b.dataset.open))}
function openApp(id){current=applications.find(a=>String(a.id)===String(id));if(!current)return;$("modalName").textContent=current.real_name+" — "+current.mc_name;$("statusSelect").value=current.status;$("details").innerHTML=`<p class="muted">Discord: ${esc(current.discord)} • Age: ${esc(current.age)}<br>Submitted: ${new Date(current.created_at).toLocaleString()}</p>`+Array.from({length:15},(_,i)=>`<div class="answer"><b>${i+1}. ${esc(questionLabels[i])}</b><p>${esc(current.answers?.["q"+(i+1)]||"No answer provided")}</p></div>`).join("");msg("modalMsg","");$("modal").classList.remove("hidden")}
const questionLabels=["What are the main responsibilities of a Minecraft server staff member?","A player reports another player for hacking. How would you investigate before taking action?","How would you handle someone continuously spamming or abusing others in chat?","What's the difference between a warning, mute, kick and ban?","Why is favouritism unacceptable within the staff team?","Your close friend is caught using hacks. What would you do?","A player starts abusing you after you warn them. How would you react?","You notice another staff member abusing their permissions. What would you do?","Two players are fighting, and both blame each other. How would you resolve the situation?","You accidentally punish an innocent player. How would you handle it?","How much time can you realistically dedicate to the server daily?","Are you comfortable following management decisions and server policies? Explain.","Why do you think you deserve a position in the staff team?","What would you do if you couldn't remain active for several days?","A player reports item theft. There is no video evidence, but you have access to CoreProtect. Explain how you would investigate and handle the case."];
$("closeModal").onclick=()=>$("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};
$("saveStatus").onclick=async()=>{if(!current)return;const {error}=await client.from("staff_applications").update({status:$("statusSelect").value}).eq("id",current.id);if(error){msg("modalMsg",error.message);return}current.status=$("statusSelect").value;msg("modalMsg","Status updated.");await loadApps();openApp(current.id)};
$("deleteApp").onclick=async()=>{if(!current||!confirm("Permanently delete this application?"))return;const id=current.id;const {error}=await client.from("staff_applications").delete().eq("id",id);if(error){msg("modalMsg",error.message);return}$("modal").classList.add("hidden");current=null;loadApps()};
$("refreshBtn").onclick=loadApps;$("search").oninput=render;$("filter").onchange=render;
checkSession();
</script></body></html>
