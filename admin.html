<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sapno Ka SMP | Recruitment Admin</title><style>
:root{color-scheme:dark;--bg:#080b12;--line:#253247;--text:#edf3ff;--muted:#9aa9c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#172b4a,transparent 38%),var(--bg);font:14px/1.55 Inter,Segoe UI,Arial,sans-serif;color:var(--text)}.wrap{max-width:1200px;margin:35px auto;padding:0 18px 50px}.top,.panel{background:linear-gradient(145deg,#131d2e,#0c121e);border:1px solid var(--line);border-radius:18px;padding:23px;margin-bottom:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.eyebrow{color:#91bfff;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}h1{margin:5px 0}.muted{color:var(--muted)}input{background:#080f1b;border:1px solid #2b3a51;border-radius:10px;padding:12px;color:var(--text);font:inherit;width:100%;margin:5px 0 12px}button,select{border:1px solid #344967;border-radius:10px;padding:10px 13px;background:#172944;color:#eaf3ff;font:inherit;cursor:pointer}button.primary{background:linear-gradient(100deg,#438fff,#8272ff);border:0;font-weight:800}button.danger{background:#3b1c27;border-color:#703348}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:17px}.stat{background:#0c1523;border:1px solid var(--line);padding:15px;border-radius:13px}.stat strong{display:block;font-size:25px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:320px;margin:0}.list{display:grid;gap:10px}.app{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#0b1422;border:1px solid var(--line);padding:14px;border-radius:12px}.app h3{margin:0 0 3px}.app p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;background:#273247}.Pending{background:#49391a;color:#ffe0a1}.Selected{background:#12432f;color:#a9f1d1}.Rejected{background:#4a202b;color:#ffc0ca}.type{background:#263b59;color:#b9d6ff}.answer{border-top:1px solid var(--line);padding:12px 0}.answer b{display:block;color:#a9caff;margin-bottom:5px}.answer p{white-space:pre-wrap;margin:0;color:#dce6f6}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:#101a2a;border:1px solid #344967;border-radius:17px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-22px;background:#101a2a;padding:5px 0 12px}.empty{text-align:center;padding:35px;color:var(--muted)}.msg{margin-top:10px;color:#ffc0ca;white-space:pre-wrap}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.app{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Sapno Ka SMP • Management</div><h1>Recruitment Dashboard</h1><div class="muted">Review staff and developer applications in one place.</div></div><button id="logout" class="hidden">Log out</button></header>
<section id="login" class="panel"><h2>Admin login</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary">Sign in</button><div id="loginMsg" class="msg"></div></form></section>
<section id="dash" class="hidden"><div class="stats"><div class="stat">All applications<strong id="total">0</strong></div><div class="stat">Staff<strong id="staff">0</strong></div><div class="stat">Developers<strong id="dev">0</strong></div><div class="stat">Pending (filtered)<strong id="pending">0</strong></div></div><section class="panel"><div class="toolbar"><select id="type"><option value="All">All application types</option><option value="staff">Staff applications</option><option value="developer">Developer applications</option></select><input id="search" placeholder="Search name, Minecraft or Discord"><select id="status"><option value="All">All statuses</option><option>Pending</option><option>Selected</option><option>Rejected</option></select><button id="refresh">Refresh</button></div><div id="list" class="list"><div class="empty">Loading...</div></div><div id="dashMsg" class="msg"></div></section></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow" id="kind">Application details</div><h2 id="person"></h2></div><button id="close">Close ✕</button></div><div id="details"></div><div class="row"><label>Status</label><select id="newStatus"><option>Pending</option><option>Selected</option><option>Rejected</option></select><button id="save" class="primary">Save status</button><button id="del" class="danger">Delete</button></div><div id="modalMsg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://iulosmqflrpypvgqrtqo.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_pBzk6KCGxJS6zOxERcF9Bw_RJIAd_Fs';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let apps=[],current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const typeOf=a=>a.application_type||'staff';function message(id,t){$(id).textContent=t||''}function signed(on){$('login').classList.toggle('hidden',on);$('dash').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){message('loginMsg',error.message);return}message('loginMsg','');signed(true);load()};$('logout').onclick=async()=>{await db.auth.signOut();signed(false)};
async function load(){message('dashMsg','');$('list').innerHTML='<div class="empty">Loading...</div>';const {data,error}=await db.from('staff_applications').select('*').order('created_at',{ascending:false});if(error){message('dashMsg',error.message+' — If application_type is missing, run add_developer_type.sql in Supabase SQL Editor.');$('list').innerHTML='<div class="empty">Could not load applications.</div>';return}apps=data||[];render()}
function render(){$('total').textContent=apps.length;$('staff').textContent=apps.filter(a=>typeOf(a)==='staff').length;$('dev').textContent=apps.filter(a=>typeOf(a)==='developer').length;const t=$('type').value,s=$('status').value,q=$('search').value.toLowerCase();const rows=apps.filter(a=>(t==='All'||typeOf(a)===t)&&(s==='All'||a.status===s)&&[a.real_name,a.mc_name,a.discord].some(v=>String(v||'').toLowerCase().includes(q)));$('pending').textContent=rows.filter(a=>a.status==='Pending').length;$('list').innerHTML=rows.length?rows.map(a=>`<article class="app"><div><h3>${esc(a.real_name)} <span class="tag ${esc(a.status)}">${esc(a.status)}</span> <span class="tag type">${typeOf(a)==='developer'?'Developer':'Staff'}</span></h3><p>${esc(a.mc_name)} • ${esc(a.discord)} • Age ${esc(a.age)} • ${new Date(a.created_at).toLocaleString()}</p></div><button data-id="${esc(a.id)}">View application →</button></article>`).join(''):'<div class="empty">No applications found.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openApp(b.dataset.id))}
const staffQ=['Main responsibilities of a Minecraft server staff member','Investigating a hacking report','Handling spam or abuse','Difference between warning, mute, kick and ban','Why favouritism is unacceptable','Close friend caught hacking','Player abuses you after warning','Staff member abusing permissions','Resolving a fight between two players','Accidentally punishing an innocent player','Daily availability','Following management decisions and policies','Why you deserve a staff position','Handling several days of inactivity','Investigating item theft with CoreProtect'];
const devQ=['Minecraft server experience and software/versions used','Plugins known and configuration/troubleshooting skills','Server commands known, with examples','LuckPerms groups, inheritance, tracks, contexts and nodes','Editing YAML and fixing syntax/configuration errors','Troubleshooting a plugin that breaks after update','Diagnosing and fixing missing command permissions','Diagnosing lag and low TPS','Safely installing/updating/configuring/removing plugins','Using CoreProtect to investigate griefing or theft','Safely communicating and performing a restart','Handling unclear plugin documentation','Backups and restore verification','Responding to unsafe changes by another developer','Server tasks you can independently handle'];
function openApp(id){current=apps.find(a=>String(a.id)===String(id));if(!current)return;const isDev=typeOf(current)==='developer',qs=isDev?devQ:staffQ,ans=current.answers||{};$('kind').textContent=isDev?'Developer application':'Staff application';$('person').textContent=current.real_name+' — '+current.mc_name;$('newStatus').value=current.status;$('details').innerHTML=`<p class="muted">Discord: ${esc(current.discord)} • Age: ${esc(current.age)}<br>Submitted: ${new Date(current.created_at).toLocaleString()}</p>`+qs.map((q,i)=>`<div class="answer"><b>${i+1}. ${esc(q)}</b><p>${esc(ans['q'+(i+1)]||'No answer provided')}</p></div>`).join('')+(isDev?['availability','portfolio','extra'].map((k,i)=>`<div class="answer"><b>${['Availability','Previous work / portfolio','Additional information'][i]}</b><p>${esc(ans[k]||'Not provided')}</p></div>`).join(''):'');message('modalMsg','');$('modal').classList.remove('hidden')}
$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('save').onclick=async()=>{if(!current)return;const {error}=await db.from('staff_applications').update({status:$('newStatus').value}).eq('id',current.id);if(error){message('modalMsg',error.message);return}current.status=$('newStatus').value;await load();openApp(current.id);message('modalMsg','Status updated.')};$('del').onclick=async()=>{if(!current||!confirm('Permanently delete this application?'))return;const {error}=await db.from('staff_applications').delete().eq('id',current.id);if(error){message('modalMsg',error.message);return}$('modal').classList.add('hidden');current=null;load()};$('refresh').onclick=load;$('search').oninput=render;$('status').onchange=render;$('type').onchange=render;db.auth.getSession().then(({data})=>{signed(!!data.session);if(data.session)load()});
</script></body></html>
